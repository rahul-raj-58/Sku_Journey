name: Refresh SKU Dashboard Data

on:
  push:
    branches: [main]          # runs immediately on every push → creates counts.json right away
    paths-ignore:
      - 'data/counts.json'    # don't re-trigger when Actions itself commits the file
  schedule:
    - cron: '*/5 * * * *'    # runs every 5 minutes — near real-time data
  workflow_dispatch:          # manual "Run workflow" button in GitHub Actions UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit data/counts.json back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch counts from Metabase
        env:
          MB_API_KEY: mb_BbbOBUMM+s1sUJTquApMnybzWwQtIjlpSmpnATkDyOc=
        run: node fetch_counts.js

      - name: Commit updated counts
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/counts.json
          # Only commit if something changed
          git diff --staged --quiet || git commit -m "chore: refresh SKU counts [skip ci]"
          git push
